name: tesservox
description: >-
  Free, offline, multilingual AAC (augmentative and alternative communication)
  for people who cannot speak. Runs on cheap Android hardware, needs no account,
  and never sends a word off the device.
publish_to: none
version: 0.1.0+1
repository: https://github.com/DARREN-2000/tesservox

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart DI/state. No native code, so the web demo stays buildable.
  flutter_riverpod: ^2.5.1
  # Platform TTS where the OS has a decent voice for the locale.
  flutter_tts: ^4.0.2
  # Access settings must survive a reboot on a shared school tablet.
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Vocabulary packs are authored in YAML and compiled to JSON assets.
  yaml: ^3.1.2
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/packs/
